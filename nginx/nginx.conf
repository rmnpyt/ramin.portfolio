server {
    listen 80;
    server_name _;

    # Allow larger uploads for CV files (PDF/DOCX up to 10 MB + multipart overhead)
    client_max_body_size 20m;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        # Generous timeout for OpenAI parsing/translation (up to ~30 s)
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Admin panel (HTML served by FastAPI)
    location /admin {
        proxy_pass http://backend:8000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Everything else → Astro SSR Node server
    location / {
        proxy_pass http://frontend:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
