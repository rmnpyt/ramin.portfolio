server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Needed for CV file uploads (PDF/DOCX up to 10 MB + multipart overhead)
    client_max_body_size 20m;

    # FastAPI — public API and admin panel HTML
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        # Generous timeout for OpenAI parsing/translation (~30 s)
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /admin {
        proxy_pass http://backend:8000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Astro SSR Node server
    location / {
        proxy_pass http://astro:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
