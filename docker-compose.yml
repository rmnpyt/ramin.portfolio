services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - portfolio_data:/data
    restart: unless-stopped

  astro:
    build:
      context: ./frontend
      args:
        PUBLIC_API_BASE_URL: ""
    expose:
      - "4321"
    environment:
      - API_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      - DOMAIN=${DOMAIN}
    expose:
      - "80"
    depends_on:
      - backend
      - astro
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.portfolio.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
      - traefik.http.services.portfolio.loadbalancer.server.port=80

volumes:
  portfolio_data:

networks:
  proxy:
    external: true
